<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="url(#logoGrad)" opacity="0.12"/>
  <!-- Router symbol: three connected nodes -->
  <circle cx="12" cy="14" r="5" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
  <circle cx="36" cy="14" r="5" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
  <circle cx="24" cy="34" r="5" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
  <!-- Connecting lines -->
  <line x1="16" y1="17" x2="32" y2="17" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="18" x2="21" y2="30" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="33" y1="18" x2="27" y2="30" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center router icon -->
  <circle cx="24" cy="22" r="3" fill="url(#logoGrad)" opacity="0.6"/>
</svg>
